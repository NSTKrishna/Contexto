name: OMNI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: omni-pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Skip review on draft pull requests
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Automated PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          OMNI_MODEL: ${{ vars.OMNI_MODEL || 'deep' }}
          REVIEW_TIMEOUT: ${{ vars.REVIEW_TIMEOUT || '180' }}
          MAX_DIFF_SIZE: ${{ vars.MAX_DIFF_SIZE || '65536' }}
        run: |
          python3 scripts/omni_pr_review.py
